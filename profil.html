<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SporTrack - Profilim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">🔥</span>SPOR<span class="logo-highlight">TRACK</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Kilo Takibi</a></li>
                <li><a href="blog.html">Topluluk</a></li>
                <li><a href="hesapla.html">Hesapla</a></li>
                <li><a href="profil.html" class="active">Profilim</a></li>
                <li><a href="admin.html" class="admin-link">Yönetim</a></li>
                <li><a href="logout.html" class="logout-link">Çıkış Yap</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="calculator-page-container" style="max-width: 700px;">
            <div style="text-align: center; margin-bottom: 25px;">
                <img id="profilePreview" src="image_9228c4.jpg" alt="Profil Fotoğrafı" class="user-avatar-small" style="width: 120px; height: 120px; border-width: 3px; margin-bottom: 15px; display: inline-block;">
                
                <div style="margin-bottom: 15px; display: flex; justify-content: center; gap: 10px;">
                    <label for="avatarUpload" class="btn-primary" style="font-size: 0.85rem; padding: 8px 16px; display: inline-block; cursor: pointer;">Fotoğraf Yükle</label>
                    <input type="file" id="avatarUpload" accept="image/*" style="display: none;">
                    <button id="removeAvatarBtn" class="btn-secondary" style="font-size: 0.85rem; padding: 8px 16px;">Fotoğrafı Kaldır</button>
                </div>

                <h2>Ahmet Onur Yener</h2>
                <span class="badge-role badge-kurucu" style="margin-left: 0; margin-top: 5px;">KURUCU</span>
            </div>

            <div class="calc-form-grid" style="grid-template-columns: 1fr;">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" value="@onur_yener" disabled style="background: #0f172a; color: #64748b; cursor: not-allowed;">
                </div>
                <div class="form-group">
                    <label>E-posta Adresi</label>
                    <input type="email" value="onur@sportrack.com" disabled style="background: #0f172a; color: #64748b; cursor: not-allowed;">
                </div>
                <div class="form-group">
                    <label>Hesap Durumu</label>
                    <div style="padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #4ade80; font-weight: bold; display: flex; align-items: center; gap: 8px;">
                        🟢 Aktif / Tam Yetkili Sürüm
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="common.js"></script>
</body>
</html>
