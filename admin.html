<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SporTrack - Yönetim Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">🔥</span>SPOR<span class="logo-highlight">TRACK</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Kilo Takibi</a></li>
                <li><a href="blog.html">Topluluk</a></li>
                <li><a href="hesapla.html">Hesapla</a></li>
                <li><a href="profil.html">Profilim</a></li>
                <li><a href="admin.html" class="active admin-link">Yönetim</a></li>
                <li><a href="logout.html" class="logout-link">Çıkış Yap</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="admin-panel-container">
            <h2>Kullanıcı Yönetimi</h2>
            <p class="admin-subtext">İşlem yapmak istediğiniz kişinin kullanıcı adını yazın:</p>
            
            <div class="admin-input-area">
                <input type="text" id="targetUsername" placeholder="Kullanıcı Adı (@name_tag)">
            </div>

            <div class="admin-actions-grid">
                <button id="makeAdminBtn" class="admin-btn btn-admin-add">Admin Yap</button>
                <button id="removeAdminBtn" class="admin-btn btn-admin-remove">Yetkiyi Al</button>
                <button id="tempBanBtn" class="admin-btn btn-ban-temp">Süreli Ban</button>
                <button id="permBanBtn" class="admin-btn btn-ban-perm">Kalıcı Ban</button>
            </div>

            <hr class="admin-divider">

            <h2>Mesaj Yönetimi</h2>
            <p class="admin-subtext">* Admin ve Kurucular kullanıcıların gerçek isimlerini görebilir.</p>
            <div id="adminMessagesContainer" class="admin-messages-list">
                </div>
        </section>
    </main>

    <script src="common.js"></script>
</body>
</html>
