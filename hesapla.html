<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SporTrack - Hesaplayıcı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">🔥</span>SPOR<span class="logo-highlight">TRACK</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Kilo Takibi</a></li>
                <li><a href="blog.html">Topluluk</a></li>
                <li><a href="hesapla.html" class="active">Hesapla</a></li>
                <li><a href="profil.html">Profilim</a></li>
                <li><a href="admin.html" class="admin-link">Yönetim</a></li>
                <li><a href="logout.html" class="logout-link">Çıkış Yap</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="calculator-page-container">
            <h2>📊 Detaylı Kalori & Makro Hesapla</h2>
            <p style="color: #94a3b8; font-size: 0.9rem;">Kişisel değerlerinizi girerek bilimsel formüllerle hedefinizi belirleyin.</p>

            <div class="calc-form-grid">
                <div class="form-group">
                    <label for="gender">Cinsiyet</label>
                    <select id="gender">
                        <option value="erkek">Erkek</option>
                        <option value="kadin">Kadın</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="age">Yaş</label>
                    <input type="number" id="age" placeholder="Örn: 22">
                </div>
                <div class="form-group">
                    <label for="height">Boy (cm)</label>
                    <input type="number" id="height" placeholder="Örn: 180">
                </div>
                <div class="form-group">
                    <label for="weight">Kilo (kg)</label>
                    <input type="number" id="weight" placeholder="Örn: 75">
                </div>
                <div class="form-group">
                    <label for="activity">Aktivite Seviyesi</label>
                    <select id="activity">
                        <option value="1.2">Hareketsiz (Spor yok)</option>
                        <option value="1.375">Hafif Aktif (Haftada 1-3 gün spor)</option>
                        <option value="1.55">Orta Aktif (Haftada 3-5 gün spor)</option>
                        <option value="1.725">Çok Aktif (Haftada 6-7 gün ağır spor)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="goal">Hedefiniz</label>
                    <select id="goal">
                        <option value="lose">Kilo Vermek (Yağ Yakımı)</option>
                        <option value="maintain">Kiloyu Korumak</option>
                        <option value="gain">Kilo Almak (Kas Kazanımı)</option>
                    </select>
                </div>
                <div class="form-group-full">
                    <button id="calcBtn" class="btn-primary">Hesapla ve Makroları Gör</button>
                </div>
            </div>

            <div id="calcResults" class="calc-results-box"></div>
        </section>
    </main>

    <script src="common.js"></script>
</body>
</html>
